<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - GreenCollect</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>GreenCollect</span>
                </div>
                <h2>User Login</h2>
                <p>Enter your credentials to access your account</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginAadhar">Aadhar Number</label>
                    <input type="text" id="loginAadhar" placeholder="Enter your 12-digit Aadhar number" maxlength="12" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <div class="auth-links">
                    <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regAadhar">Aadhar Number</label>
                    <input type="text" id="regAadhar" placeholder="Enter your 12-digit Aadhar number" maxlength="12" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="regAddress">Address</label>
                    <textarea id="regAddress" placeholder="Enter your complete address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="regProof">Residence Proof</label>
                    <select id="regProof" required>
                        <option value="">Select proof type</option>
                        <option value="aadhar">Aadhar Card</option>
                        <option value="voter">Voter ID</option>
                        <option value="ration">Ration Card</option>
                        <option value="electricity">Electricity Bill</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regProofNumber">Proof Number</label>
                    <input type="text" id="regProofNumber" placeholder="Enter proof document number" required>
                </div>
                <div class="form-group">
                    <label for="regBankAccount">Bank Account Number</label>
                    <input type="text" id="regBankAccount" placeholder="Enter your bank account number" required>
                </div>
                <div class="form-group">
                    <label for="regIFSC">IFSC Code</label>
                    <input type="text" id="regIFSC" placeholder="Enter bank IFSC code" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>

            <div class="auth-footer">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="messageContent"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
