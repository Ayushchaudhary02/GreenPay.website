<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - GreenCollect</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>GreenCollect</span>
                </div>
                <h2>User Portal</h2>
                <p>Enter your credentials to access your account</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')" id="loginTab">Login</button>
                <button class="tab-btn" onclick="switchTab('register')" id="registerTab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginAadhar">Aadhar Number</label>
                    <input type="text" id="loginAadhar" placeholder="Enter your 12-digit Aadhar number" maxlength="12" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <div class="auth-links">
                    <a href="#" onclick="showMessage('Please contact administrator to reset password', 'info')">Forgot Password?</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regAadhar">Aadhar Number</label>
                    <input type="text" id="regAadhar" placeholder="Enter your 12-digit Aadhar number" maxlength="12" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="regAddress">Address</label>
                    <textarea id="regAddress" placeholder="Enter your complete address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="regBankAccount">Bank Account Number</label>
                    <input type="text" id="regBankAccount" placeholder="Enter your bank account number" required>
                </div>
                <div class="form-group">
                    <label for="regIFSC">IFSC Code</label>
                    <input type="text" id="regIFSC" placeholder="Enter bank IFSC code" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>

            <div class="auth-footer">
                <a href="index.html">← Back to Home</a>
            </div>

            <!-- Demo Credentials -->
            <div class="demo-info" style="margin-top: 20px; padding: 15px; background: #e8f5e8; border-radius: 8px; font-size: 14px;">
                <strong>Demo Login:</strong><br>
                Aadhar: 123456789012<br>
                Password: demo123
            </div>
        </div>
    </div>

    <script>
        // Initialize demo data
        if (!localStorage.getItem('users')) {
            const demoUsers = [
                {
                    id: 'USR001',
                    fullName: 'Raj Kumar',
                    aadhar: '123456789012',
                    phone: '9876543210',
                    address: '123 Village Road, District Name, State - 123456',
                    bankAccount: '1234567890123456',
                    ifsc: 'SBIN0001234',
                    password: 'demo123',
                    status: 'active',
                    totalEarnings: 1250,
                    totalWaste: 45.5,
                    totalTransactions: 23,
                    ecoPoints: 455
                }
            ];
            localStorage.setItem('users', JSON.stringify(demoUsers));
        }

        // Tab switching
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const aadhar = document.getElementById('loginAadhar').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!aadhar || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            if (aadhar.length !== 12) {
                showMessage('Please enter a valid 12-digit Aadhar number', 'error');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.aadhar === aadhar && u.password === password);
            
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1500);
            } else {
                showMessage('Invalid credentials. Please try again.', 'error');
            }
        });

        // Handle registration
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('regFullName').value;
            const aadhar = document.getElementById('regAadhar').value;
            const phone = document.getElementById('regPhone').value;
            const address = document.getElementById('regAddress').value;
            const bankAccount = document.getElementById('regBankAccount').value;
            const ifsc = document.getElementById('regIFSC').value;
            const password = document.getElementById('regPassword').value;
            
            if (!fullName || !aadhar || !phone || !address || !bankAccount || !ifsc || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            if (aadhar.length !== 12) {
                showMessage('Please enter a valid 12-digit Aadhar number', 'error');
                return;
            }
            
            if (phone.length !== 10) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.find(u => u.aadhar === aadhar)) {
                showMessage('User with this Aadhar number already exists', 'error');
                return;
            }
            
            const newUser = {
                id: 'USR' + String(users.length + 1).padStart(3, '0'),
                fullName,
                aadhar,
                phone,
                address,
                bankAccount,
                ifsc,
                password,
                status: 'active',
                totalEarnings: 0,
                totalWaste: 0,
                totalTransactions: 0,
                ecoPoints: 0
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            showMessage('Registration successful! You can now login.', 'success');
            setTimeout(() => {
                switchTab('login');
                this.reset();
            }, 2000);
        });

        // Show message function
        function showMessage(message, type) {
            const existingMessage = document.querySelector('.message-popup');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-popup';
            messageDiv.innerHTML = `
                <div style="
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: ${type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8'};
                    color: white;
                    padding: 15px 20px;
                    border-radius: 5px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    z-index: 1000;
                    font-size: 14px;
                    max-width: 300px;
                ">
                    ${message}
                </div>
            `;
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                if (document.body.contains(messageDiv)) {
                    messageDiv.remove();
                }
            }, 4000);
        }

        // Input validation
        document.getElementById('loginAadhar').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        document.getElementById('regAadhar').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        document.getElementById('regPhone').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        console.log('User login page loaded successfully');
    </script>
</body>
</html>
